# nginx — reverse proxy vers Saturn Studio (Next.js sur 127.0.0.1:3000)
# 1. Copier dans /etc/nginx/sites-available/saturn-studio
# 2. Remplacer TON-DOMAINE
# 3. ln -s /etc/nginx/sites-available/saturn-studio /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
# 5. HTTPS : certbot --nginx -d TON-DOMAINE   (réécrit ce fichier pour le 443)

server {
    listen 80;
    server_name TON-DOMAINE;

    # Upload de fichiers (images produit, PDF) — marge confortable.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # génération LLM = requêtes longues
    }
}
